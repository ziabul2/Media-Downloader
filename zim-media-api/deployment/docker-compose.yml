services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    mem_limit: 128m
    cpus: 0.25

  api:
    build: ..
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      EXTRACTION_BACKEND: queue
      AUTO_CREATE_SCHEMA: "false"
      REDIS_REQUIRED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - internal
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: ..
    restart: unless-stopped
    env_file:
      - ../.env
    entrypoint: ["python", "-m", "app.worker"]
    environment:
      EXTRACTION_BACKEND: queue
      AUTO_CREATE_SCHEMA: "false"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    mem_limit: 768m
    cpus: 1.0

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - internal
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: zim_media
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zim -d zim_media"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edge:
  internal:
    internal: true

volumes:
  pgdata:
